version: '3.8'

networks:
  cinev2-azure-network:
    driver: bridge

volumes:
  postgres_auth_data:

services:
  # ===================================================================
  # NODO MICROSOFT AZURE: TICKET-AUTH + IA-MCP
  # Frameworks: Spring Boot 3 (Java 21) + React + FastAPI (Python 3.11)
  # ===================================================================

  postgres-auth:
    image: postgres:15-alpine
    container_name: SW2-P2-CINEv2-postgres-auth
    environment:
      POSTGRES_DB: db_tickets_auth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5434:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - cinev2-azure-network
    restart: unless-stopped

  ms-ticket-auth-backend:
    build:
      context: ./ms/ms-ticket-auth/backend
      dockerfile: Dockerfile
    container_name: SW2-P2-CINEv2-ms-ticket-auth-backend
    environment:
      DB_HOST: postgres-auth
      DB_PORT: 5432
      DB_NAME: db_tickets_auth
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      # Conexión Cross-Cloud hacia GCP (Cinema Core) y AWS (Multimedia)
      CINEMA_CORE_URL: ${CORE_API_URL:-http://localhost:3000}
      MULTIMEDIA_URL: ${MULTIMEDIA_URL:-http://localhost:3001}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkeyforcinemav2production2026hexformat001122334455667788}
      HMAC_SECRET_KEY: ${HMAC_SECRET_KEY:-clave_secreta_para_firmar_boletos_qr_hmac_sha256_cinev2_universidad_2026}
      JAVA_OPTS: "-Xms128m -Xmx384m -XX:+UseG1GC"
    ports:
      - "8081:8081"
    depends_on:
      - postgres-auth
    networks:
      - cinev2-azure-network
    restart: unless-stopped

  ms-ticket-auth-frontend:
    build:
      context: ./ms/ms-ticket-auth/frontend
      dockerfile: Dockerfile
    container_name: SW2-P2-CINEv2-ms-ticket-auth-frontend
    ports:
      - "5174:80"
    networks:
      - cinev2-azure-network
    restart: unless-stopped

  ms-ia-mcp-backend:
    build:
      context: ./ms/ms-ia-mcp/backend
      dockerfile: Dockerfile
    container_name: SW2-P2-CINEv2-ms-ia-mcp-backend
    environment:
      CINEMA_CORE_URL: ${CORE_API_URL:-http://localhost:3000}
      CORE_API_URL: ${CORE_API_URL:-http://localhost:3000}
      MULTIMEDIA_URL: ${MULTIMEDIA_URL:-http://localhost:3001}
      MULTIMEDIA_API_URL: ${MULTIMEDIA_URL:-http://localhost:3001}
      GROQ_API_KEY: ${GROQ_API_KEY:-${GROK_API_KEY:-mock_groq_api_key_cinev2}}
      GROK_API_KEY: ${GROK_API_KEY:-${GROQ_API_KEY:-mock_groq_api_key_cinev2}}
      GROK_MODEL: ${GROK_MODEL:-qwen/qwen3.8-27b}
      GROK_BASE_URL: ${GROK_BASE_URL:-https://api.groq.com/openai/v1}
    ports:
      - "8001:8001"
    networks:
      - cinev2-azure-network
    restart: unless-stopped

  ms-ia-mcp-frontend:
    build:
      context: ./ms/ms-ia-mcp/frontend
      dockerfile: Dockerfile
    container_name: SW2-P2-CINEv2-ms-ia-mcp-frontend
    ports:
      - "5176:80"
    networks:
      - cinev2-azure-network
    restart: unless-stopped
